<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0b1020" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f293d" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes scan {
        0% { transform: translateY(-30px); opacity: 0; }
        30% { opacity: 0.6; }
        70% { opacity: 0.6; }
        100% { transform: translateY(250px); opacity: 0; }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }

      @keyframes streamDash {
        from { stroke-dashoffset: 60; }
        to { stroke-dashoffset: 0; }
      }

      @keyframes nodeBlink {
        0%, 100% { fill: #38bdf8; filter: drop-shadow(0 0 2px #38bdf8); }
        50% { fill: #34d399; filter: drop-shadow(0 0 8px #34d399); }
      }

      @keyframes liveStatus {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      .scan-line {
        animation: scan 4s linear infinite;
      }

      .pulse-glow {
        animation: pulseGlow 3s ease-in-out infinite;
      }

      .flow-path {
        stroke-dasharray: 6 6;
        animation: streamDash 2s linear infinite;
      }

      .status-pulse {
        animation: liveStatus 1.6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" />
  <rect width="900" height="240" rx="16" fill="url(#gridPattern)" />

  <!-- Outer Border -->
  <rect width="898" height="238" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Animated Scanner Bar -->
  <line x1="20" y1="0" x2="880" y2="0" stroke="url(#pulseGrad)" stroke-width="2" class="scan-line" />

  <!-- Decorative Corner Accents -->
  <path d="M 24 40 L 24 24 L 40 24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
  <path d="M 876 40 L 876 24 L 860 24" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.8" />
  <path d="M 24 200 L 24 216 L 40 216" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.8" />
  <path d="M 876 200 L 876 216 L 860 216" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8" />

  <!-- Header Badge -->
  <g transform="translate(48, 38)">
    <rect width="210" height="26" rx="6" fill="#131c31" stroke="#223254" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#34d399" class="status-pulse" />
    <text x="26" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2">SYSTEM ONLINE / RUNNING</text>
  </g>

  <!-- Version Tag -->
  <g transform="translate(745, 38)">
    <rect width="105" height="26" rx="6" fill="#131c31" stroke="#223254" stroke-width="1" />
    <text x="52" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.8">VERSION 1.0.0</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="48" y="112" fill="url(#cyanPurpleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">CI DOCTOR AI</text>
  <text x="48" y="142" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="14" font-weight="400" letter-spacing="0.3">Autonomous CI/CD Pipeline Debugger &amp; Automated Recovery Patch Engine</text>

  <!-- Pipeline Steps Ribbon -->
  <g transform="translate(48, 175)">
    <!-- Stage 1 -->
    <rect width="170" height="34" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
    <circle cx="16" cy="17" r="4" fill="#ef4444" />
    <text x="30" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="500">1. Action Failure</text>

    <!-- Connector 1 -->
    <line x1="172" y1="17" x2="204" y2="17" stroke="#38bdf8" stroke-width="1.5" class="flow-path" />

    <!-- Stage 2 -->
    <g transform="translate(206, 0)">
      <rect width="170" height="34" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#38bdf8" />
      <text x="30" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="500">2. Log Extraction</text>
    </g>

    <!-- Connector 2 -->
    <line x1="378" y1="17" x2="410" y2="17" stroke="#818cf8" stroke-width="1.5" class="flow-path" />

    <!-- Stage 3 -->
    <g transform="translate(412, 0)">
      <rect width="170" height="34" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#c084fc" />
      <text x="30" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="500">3. Gemini Diagnosis</text>
    </g>

    <!-- Connector 3 -->
    <line x1="584" y1="17" x2="616" y2="17" stroke="#34d399" stroke-width="1.5" class="flow-path" />

    <!-- Stage 4 -->
    <g transform="translate(618, 0)">
      <rect width="184" height="34" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#34d399" />
      <text x="30" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="500">4. Recovery Patch Diff</text>
    </g>
  </g>
</svg>
